# dsh-free-tier-router bundle layer
# profile 在 dsh.profile.bundles 里列出本包时，这一层会被自动应用。
#
# 注意：`name` 是**包名**（经 profile 的 node_modules 或安装级 fallback
# $DSH_HOME/profiles/node_modules 解析），不是相对路径。
#
# 数据不在这里配 —— 它们住在 ~/.dsh/llm-router/（config.json / .env / catalog.json），
# 首次加载时自动从插件内置模板生成。这样换台电脑解压安装就能用。
- insert:
    - id: llm-router-panel
      name: dsh-free-tier-router
      config:
        # 代理监听端口。若该端口上已有另一个 llm-router 在跑（例如独立项目的 start.cmd），
        # 插件会自动复用它，不会重复启动。
        port: 8787

# 把 DSH 的搜索 provider 钉成本插件注册的 'tavily'（实现见 lib/tavily-search.mjs）。
#
# 为什么必须钉：dsh-web 在**执行期**解析 provider，规则是
#   配了 id 且注册且 available → 用它；没配 id + 恰好一个可用 → 也用它；
#   没配 id + 多个可用 → 抛 WEB_PROVIDER_AMBIGUOUS。
# 内置的 dsh-web-search-deepseek 只要有 key 就 available，所以不钉这一行，
# 本插件的 tavily 一注册就会变成「两个可用」，原生 web_search 直接报歧义。
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: tavily
